plugins {
  id 'com.android.application'
}

/* La clave con la que se firma no vive en el repositorio: la pasa el
   flujo de trabajo por el entorno.  Si no hay ninguna, se compila sin
   firmar y sólo sirve la versión de depuración. */
def almacen = System.getenv('MONXU_ALMACEN')

android {
  namespace 'es.monxucad.app'
  compileSdk 35

  defaultConfig {
    applicationId 'es.monxucad.app'
    /* Android 7 en adelante.  Poner el listón más alto no aporta nada
       aquí y deja fuera teléfonos que podrían con esto de sobra. */
    minSdk 24
    targetSdk 35
    versionCode 3
    versionName '1.0.2'
  }

  signingConfigs {
    if (almacen) {
      firma {
        storeFile file(almacen)
        storePassword System.getenv('MONXU_ALMACEN_CLAVE')
        keyAlias System.getenv('MONXU_ALIAS')
        keyPassword System.getenv('MONXU_ALIAS_CLAVE')
      }
    }
  }

  buildTypes {
    release {
      /* Sin ofuscar: esto es una envoltura de cuatro clases y
         encogerla no ahorra nada que merezca el riesgo. */
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (almacen) signingConfig signingConfigs.firma
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.12.1'
}

/* La aplicación web no está duplicada dentro del proyecto Android:
   vive en web/, que es lo que se publica también en la página y lo
   que empaqueta la versión de escritorio.  Se copia a los activos
   antes de cada compilación, para que el APK no se quede con una
   copia vieja.

   Queda fuera el service worker: dentro del APK los archivos ya son
   locales, así que sólo añadiría una segunda capa de caché capaz de
   seguir sirviendo la versión anterior después de actualizar. */
def copiaWeb = tasks.register('copiaWeb', Sync) {
  from rootProject.file('../web')
  into file('src/main/assets')
  exclude 'sw.js'
}

tasks.named('preBuild') { dependsOn copiaWeb }
