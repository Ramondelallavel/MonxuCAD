# Compila el APK de Android, lo abre en un teléfono virtual para
# comprobar que de verdad funciona, y lo deja descargable.
#
# El APK sale firmado como versión, no como depuración: un APK de
# depuración lo bloquea Play Protect con mucha más facilidad.  La clave
# se toma de los secretos del repositorio si los hay; si no, se hace
# una en el propio flujo, y entonces cada compilación lleva una firma
# distinta y hay que desinstalar la anterior para poner la nueva.
name: Compilar el APK de Android

on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/android.yml'
      - '.github/publicar.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # La máquina de GitHub ya trae el SDK de Android instalado.  La
      # acción de turno para prepararlo sigue pidiendo el paquete
      # «tools», retirado hace años, y se cae; usar lo que ya hay es
      # más corto y no depende de eso.
      - name: Piezas del SDK
        run: |
          raiz="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager=$(find "$raiz/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          if [ -z "$sdkmanager" ]; then echo "No hay sdkmanager en $raiz"; exit 1; fi
          echo "SDK en $raiz"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$raiz" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$raiz" >> "$GITHUB_ENV"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # La firma y la compilación van en el mismo paso a propósito: así
      # las contraseñas no salen de él.
      - name: Compilar y firmar
        working-directory: android
        env:
          ALMACEN_B64: ${{ secrets.ANDROID_ALMACEN_BASE64 }}
          ALMACEN_CLAVE: ${{ secrets.ANDROID_ALMACEN_CLAVE }}
          ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ALIAS_CLAVE: ${{ secrets.ANDROID_ALIAS_CLAVE }}
        run: |
          ruta="$RUNNER_TEMP/firma.jks"
          if [ -n "${ALMACEN_B64:-}" ]; then
            printf '%s' "$ALMACEN_B64" | base64 -d > "$ruta"
            export MONXU_ALMACEN="$ruta"
            export MONXU_ALMACEN_CLAVE="$ALMACEN_CLAVE"
            export MONXU_ALIAS="$ALIAS"
            export MONXU_ALIAS_CLAVE="$ALIAS_CLAVE"
            echo "Firmando con la clave guardada en el repositorio."
          else
            paso=$(openssl rand -hex 24)
            keytool -genkeypair -v -keystore "$ruta" -alias monxucad \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$paso" -keypass "$paso" \
              -dname "CN=MonxuCAD, O=MonxuCAD, C=ES" > /dev/null
            export MONXU_ALMACEN="$ruta"
            export MONXU_ALMACEN_CLAVE="$paso"
            export MONXU_ALIAS=monxucad
            export MONXU_ALIAS_CLAVE="$paso"
            echo "::notice title=Firma de usar y tirar::No hay clave guardada en el repositorio, así que esta compilación lleva una firma propia. Para actualizar habrá que desinstalar la versión anterior. En docs/NATIVO.md está cómo guardar una clave fija."
          fi
          gradle assembleRelease --no-daemon --stacktrace

      # La aplicación web se copia a los activos antes de compilar; si
      # esa copia fallara, el APK saldría vacío por dentro y arrancaría
      # en una pantalla en blanco sin que nada avisara.
      - name: Comprobar qué lleva el APK dentro
        working-directory: android
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          dentro=$(unzip -l "$apk" | grep -c 'assets/js/.*\.js' || true)
          echo "Scripts dentro del APK: $dentro"
          unzip -l "$apk" | grep -q 'assets/index.html' || { echo "FALTA index.html"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/app.css'   || { echo "FALTA app.css"; exit 1; }
          esperados=$(ls ../web/js/*.js | wc -l)
          if [ "$dentro" -lt "$esperados" ]; then
            echo "Faltan scripts: $dentro de $esperados"; exit 1
          fi

      # Sin firma no se instala, y marcado como depurable lo bloquea
      # Play Protect.  Las dos cosas se ven aquí y no en el teléfono.
      - name: Comprobar la firma y que no va como depuración
        working-directory: android
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          herramientas="$ANDROID_HOME/build-tools/35.0.0"
          "$herramientas/apksigner" verify --verbose "$apk"
          badging=$("$herramientas/aapt2" dump badging "$apk")
          if echo "$badging" | grep -q "application-debuggable"; then
            echo "El APK va marcado como depurable."; exit 1
          fi
          # Un APK marcado «testOnly» lo rechaza el instalador del
          # teléfono con «no se ha instalado», aunque adb lo acepte.
          if echo "$badging" | grep -qi "testOnly"; then
            echo "El APK va marcado como testOnly y el teléfono lo rechazaría."; exit 1
          fi
          echo "$badging" | grep -E "^package|sdkVersion|targetSdkVersion|application-label:"

      # La dirección que abre la aplicación y la carpeta donde Gradle
      # deja los archivos tienen que casar: el repartidor de rutas
      # quita su prefijo antes de buscar.  Si se cambia una sola de las
      # dos cosas, el APK compila igual y arranca en blanco.
      - name: Comprobar que la dirección de arranque casa con los activos
        run: |
          ruta=$(grep -o 'RUTA = "[^"]*"' android/app/src/main/java/es/monxucad/app/MainActivity.java | cut -d'"' -f2)
          destino=$(grep -o "into file('[^']*')" android/app/build.gradle | cut -d"'" -f2)
          echo "prefijo de la dirección: $ruta"
          echo "carpeta de los activos:  $destino"
          if [ "$destino" != "src/main/assets" ]; then
            echo "Con los archivos en '$destino', el prefijo '$ruta' buscaría en otro sitio."
            exit 1
          fi

      - name: Renombrar
        working-directory: android
        run: |
          mkdir -p ../salida
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" ../salida/MonxuCAD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonxuCAD-android-apk
          path: salida/MonxuCAD.apk
          retention-days: 90
          if-no-files-found: error

  # Compilar no demuestra nada: una ruta mal puesta deja la aplicación
  # cargando una página que no existe, y el APK parece correcto.  Aquí
  # se instala en un teléfono virtual, se abre y se mira la pantalla.
  probar:
    name: Abrirlo en un teléfono virtual
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MonxuCAD-android-apk
          path: salida

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dejar usar la virtualización de la máquina
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar, abrir y mirar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android/prueba/en-el-emulador.sh salida/MonxuCAD.apk

      # La captura vale tanto si sale bien como si sale mal: es lo que
      # se mira para saber qué pasó.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MonxuCAD-android-captura
          path: |
            salida/pantalla.png
            salida/registro.txt
          retention-days: 30
          if-no-files-found: warn

  # Sólo se publica lo que ya se ha visto arrancar.
  publicar:
    name: Dejarlo descargable
    needs: probar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MonxuCAD-android-apk
          path: salida

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El .apk suelto no le sirve a todo el mundo: hay navegadores
          # de móvil y gestores de correo que se niegan a manejarlo.
          # Comprimido pasa por donde el suelto no, así que se publican
          # los dos y cada cual coge el que le funcione.
          (cd salida && zip -q -9 MonxuCAD-apk.zip MonxuCAD.apk)
          bash .github/publicar.sh salida/MonxuCAD.apk salida/MonxuCAD-apk.zip

      - name: Dónde queda
        run: |
          {
            echo "## Descarga directa"
            echo
            echo "https://github.com/${{ github.repository }}/releases/latest/download/MonxuCAD.apk"
            echo
            echo "Enlace fijo, sin cuenta y sin descomprimir: se abre desde el móvil y se instala."
          } >> "$GITHUB_STEP_SUMMARY"
