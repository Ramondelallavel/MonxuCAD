# Compila el APK de Android.
#
# Aquí no se firma para la tienda: el APK sale firmado con la clave de
# depuración, que es la que permite instalarlo a mano en el teléfono.
# Para subirlo a Google Play hace falta una clave propia; está contado
# en docs/NATIVO.md.
name: Compilar el APK de Android

on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Herramientas de Android
        uses: android-actions/setup-android@v3

      - name: Piezas del SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # La aplicación web se copia a los activos antes de compilar; si
      # esa copia fallara, el APK saldría vacío por dentro y arrancaría
      # en una pantalla en blanco sin que nada avisara.
      - name: Comprobar que el APK lleva la aplicación dentro
        working-directory: android
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          dentro=$(unzip -l "$apk" | grep -c 'assets/www/js/.*\.js' || true)
          echo "Scripts dentro del APK: $dentro"
          unzip -l "$apk" | grep -q 'assets/www/index.html' || { echo "FALTA index.html"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/www/app.css'   || { echo "FALTA app.css"; exit 1; }
          esperados=$(ls ../web/js/*.js | wc -l)
          if [ "$dentro" -lt "$esperados" ]; then
            echo "Faltan scripts: $dentro de $esperados"; exit 1
          fi

      - name: Renombrar
        working-directory: android
        run: |
          mkdir -p ../salida
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ../salida/MonxuCAD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonxuCAD-android-apk
          path: salida/MonxuCAD.apk
          retention-days: 90
          if-no-files-found: error

      - name: Dónde queda
        run: |
          {
            echo "## APK de Android"
            echo
            echo "Se descarga de **Artifacts**, al final de esta misma página:"
            echo "\`MonxuCAD-android-apk\`."
            echo
            echo "Viene firmado con la clave de depuración, así que el teléfono"
            echo "pedirá permiso para instalar de fuera de la tienda."
          } >> "$GITHUB_STEP_SUMMARY"
